[project]
name = "rubric"
version = "0.1.0"
description = "Applies rules from rules.toml to new Zenmoney operations"
requires-python = ">=3.12"
dependencies = ["tzdata"]   # zoneinfo data for slim images

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
