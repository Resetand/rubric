# Пример. make init копирует его в rules.toml — замени имена на свои.
# Что autopilot делает с новыми операциями Zenmoney. Код знает только типы правил; все конкретное — здесь.
# Счета и категории — по названию в Zenmoney («Родитель / Дочерняя»). Переименовал в приложении — поправь здесь:
# пока имя не найдено, autopilot ничего не пишет и присылает ошибку.

lookback_days = 30         # операции старше не трогаются
settle_days = 1            # операция ждет столько дней после своей даты: банк еще может ее поменять
max_writes_per_run = 40    # больше правок за раз — ничего не пишется, приходит ошибка
ignore_accounts = []   # счета, которые не трогать никогда

# T-Bank округляет покупки и откладывает разницу в копилку, но в Zenmoney округление приходит тратой без получателя.
[[transfer]]
name = "Округления → копилка"
to_account = "Непредвиденные расходы"
keep_target_balance = true   # баланс копилки приходит из банка и округление уже включает
[transfer.match]
account = "T-Bank"
kind = "expense"
no_payee = true
no_comment = true
below = 50
foreign = false              # покупка в валюте без получателя — не округление
same_day_purchase = true      # округление бывает только в день покупки

# Перевод себе за границу: трата в T-Bank и поступление в другой валюте склеиваются в один перевод.
[[fx_transfer]]
name = "Переводы себе за границу"
to_accounts = ["Foreign Bank (GEL)", "Foreign Bank (USD)"]
income_regex = "private transfers|zolotaya korona|transfer to the card"
max_days = 2
rate_tolerance = 0.15
[fx_transfer.match]
account = "T-Bank"
kind = "expense"
payee = ["IVAN I.", "Иван И."]

# Покупка и ее полный возврат удаляются парой: одна сумма, один счет, тот же магазин, возврат не раньше покупки.
# Частичный возврат и возврат в другой валюте не трогаются: они остаются доходом в категории покупки.
# Удаление в Zenmoney необратимо (undo создает копии), поэтому условия строгие.
[refund]
name = "Возвраты"
max_days = 60
merchant_aliases = [
  ["Яндекс Сервисы", "Сервисы Яндекса", "Яндекс Такси"],
]
skip_payee_regex = '^[A-ZА-ЯЁ][a-zа-яё]+( [A-ZА-ЯЁ][a-zа-яё]+)? [A-ZА-ЯЁ]\.$'   # «Имя Ф.»: человек вернул долг, это не возврат

# Яндекс Банк не подключается к Zenmoney: такси и еда оплачиваются переводом себе. До 700 ₽ — такси, дороже — доставка.
# Ждет 3 дня: за это время приходит поступление на другой свой счет, если это на самом деле перевод себе.
[[category]]
name = "Оплаты Яндекса"
settle_days = 3
bands = [
  { below = 700, category = "Transport / Taxi" },
  { category = "Food / Food Delivery" },
]
[category.match]
account = "T-Bank"
kind = "expense"
payee = ["Себе в другой банк", "Иван И."]
below = 20000

[[notice]]
name = "Крупный перевод себе"
text = "перевод себе крупной суммой: если это накопительный счет или вклад — сделай переводом"
settle_days = 3
[notice.match]
account = "T-Bank"
payee = ["Себе в другой банк", "Иван И.", "IVAN I."]
at_least = 20000
